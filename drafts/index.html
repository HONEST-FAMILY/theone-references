<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0b">
<title>BUILDGO 시안 모음 — 더원파트너스</title>
<meta property="og:title" content="BUILDGO 시안 모음 — 더원파트너스">
<meta property="og:description" content="BUILDGO 플랫폼 시안 4개를 한곳에 모았습니다. 눌러서 폰과 PC에서 바로 확인해 보세요.">
<meta property="og:image" content="https://honest-family.github.io/theone-references/img/draft4.jpg">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root { --bg: #0a0a0b; --fg: #f3f3f1; --mute: #9c9c98; --line: #232326; --card: #141416; --accent: #32bbff; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; letter-spacing: -0.2px; word-break: keep-all; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
.top { padding-top: 26px; padding-bottom: 36px; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--mute); font-size: 14px; }
.back:hover { color: var(--fg); }
.eyebrow { margin: 40px 0 12px; color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .06em; }
h1 { margin: 0; font-size: clamp(34px, 5.4vw, 56px); line-height: 1.12; letter-spacing: -1.6px; }
.lead { margin: 16px 0 24px; max-width: 640px; color: var(--mute); font-size: 16px; line-height: 1.7; }
.copyall { display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--fg); color: #111; font-size: 15px; font-weight: 700; }
.copyall svg { width: 18px; height: 18px; }
.grid { display: grid; gap: 18px; grid-template-columns: 1fr; padding-bottom: 64px; }
.card { display: flex; flex-direction: column; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.shot { position: relative; display: block; aspect-ratio: 16 / 11; overflow: hidden; background: radial-gradient(120% 90% at 20% 0%, #24262c 0%, #141416 60%); border-bottom: 1px solid var(--line); }
.shot img { position: absolute; display: block; transition: transform .35s ease; }
.shot .pc { left: 6%; top: 9%; width: 76%; border-radius: 10px; border: 1px solid rgba(255,255,255,.08); box-shadow: 0 22px 50px rgba(0,0,0,.55); }
.shot .m { right: 6%; top: 21%; width: 25%; border-radius: 16px; border: 4px solid #2a2b30; background: #2a2b30; box-shadow: 0 22px 44px rgba(0,0,0,.6); }
.card:hover .shot .pc { transform: translateY(-4px); }
.card:hover .shot .m { transform: translateY(-8px); }
.info { display: flex; flex-direction: column; flex: 1; padding: 18px 18px 20px; }
.tag { align-self: flex-start; padding: 5px 11px; border: 1px solid #34363c; border-radius: 999px; color: #d7d7d3; font-size: 12.5px; font-weight: 600; }
.feat .tag { border-color: var(--accent); color: var(--accent); }
.info h2 { margin: 12px 0 8px; font-size: 20px; line-height: 1.38; letter-spacing: -0.6px; }
.info p { flex: 1; margin: 0 0 18px; color: var(--mute); font-size: 14.5px; line-height: 1.65; }
.act { display: flex; flex-wrap: wrap; gap: 8px; }
.open { display: inline-flex; align-items: center; height: 42px; padding: 0 18px; border-radius: 999px; background: #f5f5f2; color: #111; font-size: 14px; font-weight: 700; }
.cp { height: 42px; padding: 0 16px; border: 1px solid #3a3a3d; border-radius: 999px; background: transparent; font-size: 14px; font-weight: 600; }
.cp:hover, .open:hover { opacity: .88; }
.url { margin: 12px 0 0; color: #6f6f6c; font-size: 12.5px; word-break: break-all; }
.foot { padding-top: 26px; padding-bottom: 48px; border-top: 1px solid var(--line); color: #6f6f6c; font-size: 13px; }
.foot a { color: var(--mute); text-decoration: underline; }
#toast { position: fixed; left: 50%; bottom: 32px; z-index: 10; padding: 12px 18px; border-radius: 10px; background: rgba(245,245,242,.96); color: #111; font-size: 14px; font-weight: 600; opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: opacity .25s, transform .25s; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
@media (min-width: 760px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card.feat { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
  .feat .shot { height: 100%; min-height: 400px; aspect-ratio: auto; border-bottom: 0; border-right: 1px solid var(--line); }
  .feat .info { padding: 34px 32px; justify-content: center; }
  .feat .info h2 { font-size: 28px; line-height: 1.32; }
  .feat .info p { flex: 0 1 auto; font-size: 15.5px; }
}
@media (max-width: 759px) { .shot .m { width: 29%; top: 17%; } }
@media (prefers-reduced-motion: reduce) { .shot img, #toast { transition: none; } }
</style>
</head>
<body>
<header class="wrap top">
  <a class="back" href="../">← 레퍼런스 보드로</a>
  <p class="eyebrow">더원파트너스 · BUILDGO 플랫폼</p>
  <h1>시안 모음</h1>
  <p class="lead">시안 4개를 한곳에 모았습니다. 카드를 누르면 실제로 눌러 볼 수 있는 화면이 열려요. 폰에서 열면 폰 화면, PC에서 열면 PC 화면으로 보입니다.</p>
  <button type="button" class="copyall" data-copy="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>링크 4개 한 번에 복사</button>
</header>
<main class="wrap grid" id="list"></main>
<footer class="wrap foot">더원파트너스 BUILDGO 플랫폼 시안 · 어니스트패밀리 · <a href="../">레퍼런스 보드 보기</a></footer>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  var D = [
    { n: 4, feat: true, tag: "시안 4 · BUILDGO 대표안", title: "검색 하나로 전문가와 자재까지", desc: "세 사이트의 장점을 역할별로 나눠 BUILDGO만의 디자인으로 다시 짠 대표안입니다. 첫 화면에서 시공 전문가와 회원 자재를 함께 찾고, 도착한 견적·회원가·등급이 한눈에 보입니다. ‘회원가로 보기’를 켜면 자재 가격이 등급가로 바뀝니다." },
    { n: 1, tag: "시안 1 · 한샘 스타일", title: "브랜드 매장처럼 단정한 화면", desc: "큰 시공 사진으로 첫 화면을 채우고, 네모 반듯한 사진 카드로 정돈했습니다. 자재는 회원가가 붙은 상품 카드로, 시공은 시공사례와 전문가 카드로 보여 줍니다." },
    { n: 2, tag: "시안 2 · 오늘의집 스타일", title: "시공 구경과 자재 쇼핑을 한 화면에", desc: "오늘의집 홈과 같은 순서로 짰습니다. 띠 배너, 아이콘 메뉴, 추천 시공사례, 남은 시간이 줄어드는 회원 특가, 베스트 순으로 이어집니다." },
    { n: 3, tag: "시안 3 · 크몽 스타일", title: "전문가 서비스를 상품처럼 고르는 화면", desc: "크몽처럼 검색창, 분야 아이콘, 넘겨 보는 배너 순으로 시작합니다. 전문가마다 기본·표준·프리미엄 패키지를 가격과 함께 올리고, 골라서 바로 견적을 요청합니다." }
  ];
  function abs(n) { return new URL(n + "/", location.href).href; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  document.getElementById("list").innerHTML = D.map(function (d) {
    return '<article class="card' + (d.feat ? " feat" : "") + '">' +
      '<a class="shot" href="' + d.n + '/" aria-label="' + esc(d.tag) + ' 열기"><img class="pc" src="../img/draft' + d.n + '.jpg" alt="' + esc(d.tag) + ' PC 첫 화면"' + (d.feat ? "" : ' loading="lazy"') + '><img class="m" src="../img/draft' + d.n + '_m.jpg" alt="' + esc(d.tag) + ' 폰 첫 화면"' + (d.feat ? "" : ' loading="lazy"') + "></a>" +
      '<div class="info"><span class="tag">' + esc(d.tag) + "</span><h2>" + esc(d.title) + "</h2><p>" + esc(d.desc) + "</p>" +
      '<div class="act"><a class="open" href="' + d.n + '/">시안 열어보기 ↗</a><button type="button" class="cp" data-copy="' + d.n + '">링크 복사</button></div>' +
      '<p class="url">' + esc(abs(d.n).replace(/^https?:\/\//, "")) + "</p></div></article>";
  }).join("");
  var tt;
  function toast(m) { var t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove("show"); }, 1800); }
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (ok, no) {
      var a = document.createElement("textarea"); a.value = text; a.setAttribute("readonly", ""); a.style.position = "fixed"; a.style.opacity = "0";
      document.body.appendChild(a); a.select();
      try { document.execCommand("copy") ? ok() : no(); } catch (e) { no(e); }
      document.body.removeChild(a);
    });
  }
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-copy]"); if (!b) return;
    var k = b.dataset.copy, text;
    if (k === "all") {
      text = "BUILDGO 시안 모음\n" + new URL("./", location.href).href + "\n\n" + D.map(function (d) { return d.tag + "\n" + abs(d.n); }).join("\n\n");
    } else {
      var d = D.filter(function (x) { return String(x.n) === k; })[0];
      text = d.tag + "\n" + abs(d.n);
    }
    copy(text).then(function () { toast(k === "all" ? "시안 링크 4개를 복사했어요" : "링크를 복사했어요"); }, function () { toast("복사가 막혀 있어요. 주소를 길게 눌러 복사해 주세요"); });
  });
})();
</script>
</body>
</html>
