<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 28%27%3E%3Crect x=%271%27 y=%271%27 width=%2726%27 height=%2726%27 rx=%276%27 fill=%27%230c121a%27/%3E%3Cpath d=%27M7 21V9l7-4 7 4v12%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%272%27/%3E%3Ccircle cx=%2721%27 cy=%2721%27 r=%272.4%27 fill=%27%23F26B1D%27/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>도아 로고 시안 4종 — BUILDGO</title>

<meta property="og:description" content="지금 로고를 바탕으로 인트로와 사이트에 어울리게 새로 그린 도아 로고 4가지입니다.">
<link rel="stylesheet" href="../assets/fonts.css?v=2">
<style>
:root { --bg: #0c121a; --fg: #f3f2ef; --mute: #a3a7ad; --line: #222a35; --card: #121a24; --accent: #f26b1d; --yel: #f8c512; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); letter-spacing: -0.2px; word-break: keep-all; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
.top { padding-top: 26px; padding-bottom: 30px; }
h1 { margin: 0; font-size: clamp(34px, 5.4vw, 56px); line-height: 1.15; letter-spacing: -1.6px; }
.list { display: grid; gap: 26px; padding: 30px 20px 50px; }
.lg { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.lg-h { display: flex; padding: 20px 24px; }
.lg-h .tag { padding: 6px 12px; border: 1px solid #364152; border-radius: 999px; color: #d9dbde; font-size: 13.5px; font-weight: 600; }
.stage { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.pn { position: relative; min-height: 330px; display: flex; align-items: center; justify-content: center; padding: 30px; overflow: hidden; }
.pn.w { background: #fff; color: #0b0b0b; }
.pn.k { background: #0b0b0b; color: #fff; }
.pn.ph { background: #333 center / cover no-repeat; color: #fff; }
.pn.ph::before { content: ""; position: absolute; inset: 0; background: url(../assets/photos/n_crane.jpg) center / cover; filter: grayscale(1) brightness(.55); }
.pn.ph > * { position: relative; }
.pn.ph > .re { position: absolute; }
.re { position: absolute; right: 12px; top: 12px; height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: rgba(0, 0, 0, .06); }
.pn.k .re, .pn.ph .re { background: rgba(255, 255, 255, .12); }
.apps { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.ap { display: flex; align-items: center; gap: 26px; min-height: 150px; padding: 24px 28px; background: #fff; color: #0b0b0b; }
.ap.k { background: #fafaf8; }
.ico { flex: none; width: 88px; height: 88px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: #0b0b0b; color: #fff; }
.ico.y { background: var(--yel); color: #0b0b0b; }
.ico svg { width: 58%; height: 58%; }
.ico.wide svg { width: 74%; }
.fav { display: flex; align-items: center; }
.fav span { width: 32px; height: 32px; border-radius: 7px; display: flex; align-items: center; justify-content: center; background: #0b0b0b; color: #fff; }
.fav svg { width: 70%; height: 70%; }
.bar { flex: 1; display: flex; align-items: center; gap: 22px; height: 64px; padding: 0 20px; border: 1px solid #e6e6e6; }
.bar .lk { height: 30px; }
.bar nav { margin-left: auto; display: flex; gap: 18px; font-size: 13px; color: #333; }
.lock { display: inline-flex; align-items: center; gap: .55em; font-size: 54px; line-height: 1; color: inherit; }
.lock .mk { width: 1.5em; height: 1.5em; }
.lock .mk.wide { width: 2.1em; height: 1.12em; }
.lk-t { display: flex; flex-direction: column; gap: .2em; }
.lk-t b { font-family: var(--font-point); font-weight: 700; font-size: 1em; letter-spacing: -0.04em; }
.lk-t b.thin { font-weight: 300; letter-spacing: .02em; }
.lk-t small { font-family: var(--font-body); font-weight: 600; font-size: .24em; letter-spacing: .02em; opacity: .7; }
.lk-t small.sp { letter-spacing: .32em; font-size: .2em; opacity: .85; }
.stack { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.stack .mk { width: 130px; height: 130px; }
.stack .lk-t { align-items: center; font-size: 46px; }
.word, .stack .word { width: min(360px, 88%); height: auto; }
.badge { width: min(330px, 90%); height: auto; }
.foot { padding-top: 26px; padding-bottom: 48px; border-top: 1px solid var(--line); color: #77808b; font-size: 14px; line-height: 1.8; }
.foot a { color: var(--mute); text-decoration: underline; }

.mk .a1, .mk .a2, .mk .s, .mk .fr, .mk .an { stroke-linecap: butt; }
.mk .ol { stroke-dasharray: 1 2; stroke-dashoffset: -1.01; stroke-linecap: butt; }
.play .mk .b { animation: lgRise .9s cubic-bezier(.2, .7, .1, 1) both; }
.play .mk .b1 { animation-delay: .55s; } .play .mk .b2 { animation-delay: .68s; } .play .mk .b3 { animation-delay: .81s; } .play .mk .b4 { animation-delay: .94s; } .play .mk .b5 { animation-delay: 1.07s; }
@keyframes lgRise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.mk .b { transform-box: fill-box; transform-origin: 50% 100%; }
.play .mk .ol { animation: lgDraw .8s cubic-bezier(.65, 0, .35, 1) both, lgUndraw .6s cubic-bezier(.65, 0, .35, 1) 1.7s forwards; }
@keyframes lgDraw { from { stroke-dasharray: 1 2; stroke-dashoffset: 1.01; } to { stroke-dasharray: 1 2; stroke-dashoffset: 0; } }
@keyframes lgUndraw { from { stroke-dasharray: 1 2; stroke-dashoffset: 0; } to { stroke-dasharray: 1 2; stroke-dashoffset: -1.01; } }
.play .mk .a1 { animation: lgDraw 1.1s cubic-bezier(.65, 0, .35, 1) .1s backwards; }
.play .mk .a2 { animation: lgDraw .9s cubic-bezier(.65, 0, .35, 1) .7s backwards; }
.play .mk .s { animation: lgDraw .45s cubic-bezier(.65, 0, .35, 1) backwards; }
.play .mk .s1 { animation-duration: .7s; animation-delay: .1s; } .play .mk .s2 { animation-delay: .75s; } .play .mk .s3 { animation-delay: 1s; } .play .mk .s4 { animation-duration: .7s; animation-delay: 1.3s; } .play .mk .s5 { animation-delay: 1.9s; }
.play .mk .dot { animation: lgPop .5s cubic-bezier(.2, .7, .1, 1) 2.35s both; }
.mk .dot, .mk .c { transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes lgPop { from { transform: scale(0); } to { transform: scale(1); } }
.play .mk .fr { animation: lgDraw 1.1s cubic-bezier(.65, 0, .35, 1) .1s backwards; }
.play .mk .c { animation: lgPop .45s cubic-bezier(.2, .7, .1, 1) both; }
.play .mk .c1 { animation-delay: .9s; } .play .mk .c2 { animation-delay: 1.05s; } .play .mk .c3 { animation-delay: 1.2s; }
.play .mk .an { animation: lgDraw .5s cubic-bezier(.65, 0, .35, 1) 1.35s backwards; }
.play .mk .tx { animation: lgWipe .7s cubic-bezier(.65, 0, .35, 1) 1.5s both; }
@keyframes lgWipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.play .lk-t > * { animation: lgUp .8s cubic-bezier(.2, .7, .1, 1) 1.3s both; }
.play .lk-t > * + * { animation-delay: 1.45s; }
@keyframes lgUp { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (max-width: 900px) {
  .stage { grid-template-columns: 1fr; }
  .pn { min-height: 260px; }
  .apps { grid-template-columns: 1fr; }
  .bar nav { display: none; }
  .lock { font-size: 40px; }
}
@media (max-width: 560px) {
  .lock { font-size: 34px; }
  .stack .lk-t { font-size: 36px; }
  .ap { flex-wrap: wrap; gap: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .play * { animation: none !important; }
}
</style>
</head>
<body>
<header class="wrap top">
  <h1 style="margin-top:40px">도아 로고 시안 4종</h1>
</header>
<main class="wrap list" id="list"></main>
<footer class="wrap foot">더원파트너스 BUILDGO 시안 · 어니스트패밀리 · <a href="../">시안 모음</a> · <a href="../intro/">인트로 5종</a></footer>
<script>
(function () {
  var uid = 0;
  function pillars(cls) {
    var id = "lp" + (++uid), d = "M12 10H50A40 40 0 0 1 50 90H12Z", bars = [[12, 12], [33.5, 10], [53, 8], [70.5, 6], [86, 4]];
    return '<svg class="mk ' + (cls || "") + '" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="' + id + '"><path d="' + d + '"/></clipPath></defs><g clip-path="url(#' + id + ')" fill="currentColor">' +
      bars.map(function (b, i) { return '<rect class="b b' + (i + 1) + '" x="' + b[0] + '" y="10" width="' + b[1] + '" height="80"/>'; }).join("") + '</g><path class="ol" d="' + d + '" fill="none" stroke="currentColor" stroke-width=".8" pathLength="1"/></svg>';
  }
  function arch(cls) {
    return '<svg class="mk ' + (cls || "") + '" viewBox="0 0 100 100" fill="none" stroke="currentColor" aria-hidden="true"><path class="a1" d="M22 92V46A28 28 0 0 1 78 46V92" stroke-width="7" pathLength="1"/><path class="a2" d="M36 92V50A14 14 0 0 1 64 50V92" stroke-width="2.4" pathLength="1"/></svg>';
  }
  function word(cls) {
    return '<svg class="mk ' + (cls || "") + '" viewBox="0 0 212 100" fill="none" stroke="currentColor" stroke-width="11" aria-hidden="true"><path class="s s1" d="M83 13H17V47H83" pathLength="1"/><path class="s s2" d="M50 58V85" pathLength="1"/><path class="s s3" d="M9 85H91" pathLength="1"/><circle class="s s4" cx="148" cy="50" r="27.5" pathLength="1" transform="rotate(-90 148 50)"/><path class="s s5" d="M193 9V91" pathLength="1"/><rect class="dot" x="199" y="44" width="12" height="12" fill="#f8c512" stroke="none"/></svg>';
  }
  function badge(cls) {
    return '<svg class="mk ' + (cls || "") + '" viewBox="0 0 104 55" aria-hidden="true"><rect class="fr" x="1.6" y="1.6" width="100.8" height="51.8" rx="9" fill="none" stroke="currentColor" stroke-width="3.2" pathLength="1"/><g fill="currentColor"><circle class="c c1" cx="20" cy="37" r="8"/><circle class="c c2" cx="28.6" cy="26.4" r="4.2"/><circle class="c c3" cx="33.6" cy="20" r="3.4"/></g><path class="an" d="M34.6 17C34 12 30 10 27 10.5" fill="none" stroke="currentColor" stroke-width="1.6" pathLength="1"/><text class="tx" x="44" y="38" fill="currentColor" font-family="S-Core Dream" font-weight="700" font-size="25" letter-spacing="-1">도아</text></svg>';
  }
  var TAG = "LH 민간신축매입약정사업 전문기업";
  var L = [
    { n: 1,
      w: function () { return '<span class="lock">' + pillars() + '<span class="lk-t"><b>도아</b><small>' + TAG + "</small></span></span>"; },
      k: function () { return '<span class="stack">' + pillars() + '<span class="lk-t"><b>도아</b></span></span>'; },
      ico: function () { return '<span class="ico">' + pillars() + "</span>"; } },
    { n: 2,
      w: function () { return '<span class="lock">' + arch() + '<span class="lk-t"><small class="sp">THE ONE PARTNERS</small><b class="thin">도아</b></span></span>'; },
      k: function () { return '<span class="stack">' + arch() + '<span class="lk-t"><small class="sp">THE ONE PARTNERS</small><b class="thin">도아</b></span></span>'; },
      ico: function () { return '<span class="ico">' + arch() + "</span>"; } },
    { n: 3,
      w: function () { return '<span class="stack">' + word("word") + '<span class="lk-t" style="font-size:40px"><small>' + TAG + "</small></span></span>"; },
      k: function () { return word("word"); },
      ico: function () { return '<span class="ico y wide">' + word() + "</span>"; } },
    { n: 4,
      w: function () { return '<span class="lock">' + badge("badge") + '<span class="lk-t"><small style="font-size:.3em">' + TAG.replace(" 전문기업", "<br>전문기업") + "</small></span></span>"; },
      k: function () { return badge("badge"); },
      ico: function () { return '<span class="ico wide">' + badge() + "</span>"; } }
  ];
  function bar(l) {
    var mk = l.n === 1 ? pillars() : l.n === 2 ? arch() : l.n === 3 ? word() : badge();
    var t = l.n === 3 ? "" : l.n === 4 ? "" : '<b style="font-family:var(--font-point);font-weight:' + (l.n === 2 ? 300 : 700) + ';font-size:20px;letter-spacing:-.04em">도아</b>';
    return '<div class="bar"><span class="lock" style="font-size:20px;gap:10px">' + mk.replace('class="mk ', 'class="mk lkm ') + t + '<span style="font-family:var(--font-point);font-weight:500;font-size:17px;margin-left:6px;color:#555">BUILDGO</span></span><nav><span>전문가 찾기</span><span>업체 찾기</span><span>자재몰</span><span>견적 문의</span></nav></div>';
  }
  document.getElementById("list").innerHTML = L.map(function (l) {
    return '<article class="lg" id="l' + l.n + '"><div class="lg-h"><span class="tag">' + l.n + "안</span></div>" +
      '<div class="stage"><div class="pn w">' + l.w() + '<button type="button" class="re">다시 보기</button></div><div class="pn k">' + l.k() + '<button type="button" class="re">다시 보기</button></div><div class="pn ph">' + l.k() + '<button type="button" class="re">다시 보기</button></div></div>' +
      '<div class="apps"><div class="ap">' + l.ico() + '<span class="fav"><span>' + l.ico().replace(/^<span class="ico[^"]*">/, "").replace(/<\/span>$/, "") + "</span></span></div><div class=\"ap k\">" + bar(l) + "</div></div></article>";
  }).join("");
  [].forEach.call(document.querySelectorAll(".lkm"), function (s) { s.style.width = s.getAttribute("viewBox") === "0 0 212 100" ? "62px" : s.getAttribute("viewBox") === "0 0 104 55" ? "58px" : "30px"; s.style.height = "30px"; });
  function play(pn) { pn.classList.remove("play"); void pn.offsetWidth; pn.classList.add("play"); }
  var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!still && "IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { play(e.target); io.unobserve(e.target); } }); }, { threshold: .45 });
    [].forEach.call(document.querySelectorAll(".pn"), function (p) { io.observe(p); });
  }
  document.addEventListener("click", function (ev) { var b = ev.target.closest(".re"); if (b) play(b.parentNode); });
})();
</script>
